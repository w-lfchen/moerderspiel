[package]
name = "moerderspiel"
version = "0.1.0"
edition = "2024"

[dependencies]
# web framework for rest api
actix-cors = "0.7.1"
actix-web = { version = "4.10.2", features = ["rustls-0_23"] }
# currently don't have the time to flesh out error types
anyhow = "1.0.97"
# pw hashing
argon2 = { version = "0.5.3", features = ["std"] }
# db connection pooling
bb8 = "0.9.1"
chrono = { version = "0.4.44", features = ["serde"] }
# db orm
diesel = { version = "2.3.7", features = [
    "chrono",
    "sqlite",
    "returning_clauses_for_sqlite_3_35",
] }
diesel-async = { version = "0.8.0", features = ["bb8", "sqlite"] }
# env file support
dotenvy = "0.15.7"
# fix weird linking issues by enabling 'bundled'
libsqlite3-sys = { version = "0.36", features = ["bundled"] }
# we will need to randomize things such as the order of players in a circle
rand = "0.10.0"
# ssl
rustls = "0.23"
# (de-)serialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.149"
# easy custom error types
thiserror = "2.0.12"
# uuid generation
uuid = { version = "1.23.0", features = ["serde", "v4"] }
