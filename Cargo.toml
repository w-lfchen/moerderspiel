[package]
name = "moerderspiel"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
# web framework for rest api
actix-web = {version = "4.10.2", features = ["rustls-0_23"]}
# currently don't have the time to flesh out error types
anyhow = "1.0.97"
# env file support
dotenvy = "0.15.7"
# we will need to randomize things such as the order of players in a circle
rand = "0.10.0"
# ssl
rustls = "0.23"
# (de-)serialization
serde = { version = "1.0.219", features = ["derive"] }
# easy custom error types
thiserror = "2.0.12"
# uuid generation
uuid = { version = "1.23.0", features = ["serde", "v4"] }
